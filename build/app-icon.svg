<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Shadow -->
    <filter id="mac-icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#001030" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001845" flood-opacity="0.22" />
    </filter>

    <!-- Deep Blue Radial/Linear Gradient -->
    <linearGradient id="mac-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E78FF" />
      <stop offset="35%" stop-color="#0062E3" />
      <stop offset="70%" stop-color="#0945B8" />
      <stop offset="100%" stop-color="#1A2D85" />
    </linearGradient>

    <!-- Inner Rim Highlight -->
    <linearGradient id="inner-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>

    <!-- Sphere Gradients -->
    <radialGradient id="ball-gold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF8D1" />
      <stop offset="25%" stop-color="#FFD60A" />
      <stop offset="75%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <radialGradient id="ball-green" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#C2F9BB" />
      <stop offset="25%" stop-color="#34C759" />
      <stop offset="75%" stop-color="#28A745" />
      <stop offset="100%" stop-color="#166534" />
    </radialGradient>

    <radialGradient id="ball-red" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFB3B8" />
      <stop offset="25%" stop-color="#FF3B30" />
      <stop offset="75%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#8B0000" />
    </radialGradient>

    <radialGradient id="ball-cyan" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#D6F4FF" />
      <stop offset="25%" stop-color="#32ADE6" />
      <stop offset="75%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#004494" />
    </radialGradient>

    <!-- Glass Tube Gradient -->
    <linearGradient id="glass-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glass Rim Glow -->
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Wooden Stick Gradient -->
    <linearGradient id="stick-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE8C2" />
      <stop offset="50%" stop-color="#FFD18A" />
      <stop offset="100%" stop-color="#DE9E50" />
    </linearGradient>

    <!-- Red Tip for Stick -->
    <linearGradient id="stick-tip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#BF1A1A" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. macOS Squircle Base with Realistic Shadow -->
  <g filter="url(#mac-icon-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#mac-bg)" />
    <!-- Inner Rim Stroke Highlight -->
    <rect x="101" y="101" width="822" height="822" rx="187" fill="none" stroke="url(#inner-rim)" stroke-width="3" />
  </g>

  <!-- 2. Ambient Light / Subtle Background Gradients inside Squircle -->
  <g clip-path="url(#squircle-clip)">
    <clipPath id="squircle-clip">
      <rect x="100" y="100" width="824" height="824" rx="188" />
    </clipPath>

    <!-- Top Left Light Reflection -->
    <circle cx="280" cy="200" r="340" fill="#64D2FF" opacity="0.22" filter="blur(60px)" />
    <!-- Bottom Center Glow -->
    <circle cx="512" cy="780" r="300" fill="#0A84FF" opacity="0.3" filter="blur(80px)" />

    <!-- 3. Central Glass Lottery Tube & Sticks -->
    <g transform="translate(512, 530)">
      
      <!-- Back Lottery Sticks -->
      <!-- Left tilted stick -->
      <g transform="rotate(-18) translate(-60, -220)" filter="url(#subtle-shadow)">
        <rect x="-14" y="0" width="28" height="260" rx="12" fill="url(#stick-wood)" />
        <rect x="-14" y="0" width="28" height="60" rx="12" fill="url(#stick-tip)" />
      </g>

      <!-- Right tilted stick -->
      <g transform="rotate(22) translate(55, -230)" filter="url(#subtle-shadow)">
        <rect x="-14" y="0" width="28" height="270" rx="12" fill="url(#stick-wood)" />
        <rect x="-14" y="0" width="28" height="60" rx="12" fill="url(#stick-tip)" />
      </g>

      <!-- Center upright high-lucky stick -->
      <g transform="rotate(4) translate(0, -280)" filter="url(#subtle-shadow)">
        <rect x="-16" y="0" width="32" height="300" rx="14" fill="url(#stick-wood)" />
        <rect x="-16" y="0" width="32" height="70" rx="14" fill="url(#stick-tip)" />
        <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="900" fill="#FFF" text-anchor="middle">吉</text>
      </g>

      <!-- Far right stick -->
      <g transform="rotate(32) translate(90, -180)" filter="url(#subtle-shadow)">
        <rect x="-12" y="0" width="24" height="240" rx="10" fill="url(#stick-wood)" />
        <rect x="-12" y="0" width="24" height="50" rx="10" fill="url(#stick-tip)" />
      </g>

      <!-- Far left stick -->
      <g transform="rotate(-30) translate(-90, -170)" filter="url(#subtle-shadow)">
        <rect x="-12" y="0" width="24" height="230" rx="10" fill="url(#stick-wood)" />
        <rect x="-12" y="0" width="24" height="50" rx="10" fill="url(#stick-tip)" />
      </g>

      <!-- 4. Frosted Glass Cylinder (Lotto Tube Body) -->
      <!-- Back Lip of Tube -->
      <ellipse cx="0" cy="-60" rx="180" ry="46" fill="#003580" opacity="0.6" stroke="#4DA8DA" stroke-width="4" />

      <!-- Back glow behind the balls -->
      <ellipse cx="0" cy="80" rx="150" ry="70" fill="#FFD60A" opacity="0.15" filter="blur(30px)" />

      <!-- Floating 3D Lottery Balls (Inside / Floating on top of the rim) -->
      <!-- Ball 1: Green (#34C759) -->
      <g transform="translate(-85, 20)" filter="url(#subtle-shadow)">
        <circle cx="0" cy="0" r="62" fill="url(#ball-green)" />
        <ellipse cx="-18" cy="-22" rx="26" ry="14" fill="#FFFFFF" opacity="0.55" transform="rotate(-25 -18 -22)" />
        <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="0.95">1</text>
      </g>

      <!-- Ball 2: Red (#FF3B30) -->
      <g transform="translate(85, 25)" filter="url(#subtle-shadow)">
        <circle cx="0" cy="0" r="58" fill="url(#ball-red)" />
        <ellipse cx="-16" cy="-20" rx="24" ry="12" fill="#FFFFFF" opacity="0.55" transform="rotate(-25 -16 -20)" />
        <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="0.95">8</text>
      </g>

      <!-- Ball 3: Giant Golden Hero Ball (#FFD60A / #FF9F0A) jumping in center-front -->
      <g transform="translate(0, -60)" filter="url(#subtle-shadow)">
        <circle cx="0" cy="0" r="82" fill="url(#ball-gold)" />
        <ellipse cx="-26" cy="-28" rx="36" ry="20" fill="#FFFFFF" opacity="0.75" transform="rotate(-30 -26 -28)" />
        <ellipse cx="18" cy="38" rx="20" ry="10" fill="#FFFFFF" opacity="0.2" transform="rotate(20 18 38)" />
        <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Arial Black', sans-serif" font-size="68" font-weight="900" fill="#92400E" text-anchor="middle">7</text>
      </g>

      <!-- Cylinder Front Wall (Translucent Glass with caustics and highlights) -->
      <!-- Main body path -->
      <path d="M-180 -60 
               C-180 0, -170 180, -150 240
               C-130 290, -70 320, 0 320
               C70 320, 130 290, 150 240
               C170 180, 180 0, 180 -60
               C150 -30, 80 -10, 0 -10
               C-80 -10, -150 -30, -180 -60 Z" 
            fill="url(#glass-front)" 
            stroke="url(#inner-rim)" 
            stroke-width="5" />

      <!-- Cylinder Front Highlight Stripe (Left Edge) -->
      <path d="M-160 -50 C-155 40, -145 180, -130 230" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="8" 
            stroke-linecap="round" 
            opacity="0.65" 
            filter="blur(1px)" />

      <!-- Cylinder Front Highlight Stripe (Right Edge) -->
      <path d="M160 -50 C155 40, 145 180, 130 230" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="4" 
            stroke-linecap="round" 
            opacity="0.4" />

      <!-- Golden Metallic Collar / Rim around the top opening -->
      <ellipse cx="0" cy="-60" rx="180" ry="46" fill="none" stroke="url(#gold-rim)" stroke-width="14" filter="url(#subtle-shadow)" />
      <!-- Golden Accent Ring around middle base -->
      <path d="M-165 90 C-90 135, 90 135, 165 90" fill="none" stroke="url(#gold-rim)" stroke-width="6" opacity="0.8" />
    </g>

    <!-- 5. Popping Golden Stars & Sparkles (Victory / Lottery Celebration) -->
    <!-- Big Sparkle Top Center -->
    <g transform="translate(512, 185) scale(1.1)" filter="url(#glow-gold)">
      <!-- 4-point Diamond Star -->
      <path d="M0 -55 C2 -16, 16 -2, 55 0 C16 2, 2 16, 0 55 C-2 16, -16 2, -55 0 C-16 -2, -2 -16, 0 -55 Z" fill="#FFF490" />
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    </g>

    <!-- Medium Sparkle Top Right -->
    <g transform="translate(690, 240) scale(0.65)" filter="url(#glow-gold)">
      <path d="M0 -45 C2 -12, 12 -2, 45 0 C12 2, 2 12, 0 45 C-2 12, -12 2, -45 0 C-12 -2, -2 -12, 0 -45 Z" fill="#FFE552" />
    </g>

    <!-- Small Sparkle Top Left -->
    <g transform="translate(320, 260) scale(0.55)" filter="url(#glow-gold)">
      <path d="M0 -40 C2 -10, 10 -2, 40 0 C10 2, 2 10, 0 40 C-2 10, -10 2, -40 0 C-10 -2, -2 -10, 0 -40 Z" fill="#FFE552" />
    </g>

    <!-- Little confetti dots -->
    <circle cx="360" cy="200" r="7" fill="#64D2FF" opacity="0.9" filter="url(#glow-gold)" />
    <circle cx="650" cy="180" r="8" fill="#FF9F0A" opacity="0.9" filter="url(#glow-gold)" />
    <circle cx="730" cy="330" r="6" fill="#34C759" opacity="0.9" filter="url(#glow-gold)" />
  </g>
</svg>