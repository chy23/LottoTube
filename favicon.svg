<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA8DA" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5E5CE6" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.4)" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <g filter="url(#shadow)" transform="translate(116, 116) scale(1.1)">
    <!-- Back face inner -->
    <path d="M128 32 L224 80 L224 208 L128 160 Z" fill="rgba(255,255,255,0.1)"/>
    <path d="M32 80 L128 32 L128 160 L32 208 Z" fill="rgba(255,255,255,0.15)"/>
    
    <!-- Colorful balls inside with glowing effects -->
    <circle cx="128" cy="110" r="36" fill="#FFD60A" filter="url(#glow)"/> 
    <circle cx="170" cy="140" r="28" fill="#32ADE6" filter="url(#glow)"/> 
    <circle cx="80" cy="130" r="32" fill="#34C759" filter="url(#glow)"/> 
    
    <!-- Front faces (glassy thick borders) -->
    <path d="M32 80 L128 128 L224 80" fill="none" stroke="url(#box-grad)" stroke-width="20" stroke-linejoin="round"/>
    <path d="M128 128 L128 224" fill="none" stroke="url(#box-grad)" stroke-width="20" stroke-linecap="round"/>
    <path d="M32 80 L32 176 L128 224 L224 176 L224 80" fill="none" stroke="url(#box-grad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- A star popping out -->
    <path d="M128 0 L138 25 L168 25 L143 45 L153 75 L128 55 L103 75 L113 45 L88 25 L118 25 Z" fill="#FF9F0A" filter="url(#glow)"/>
  </g>
</svg>